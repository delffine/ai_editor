# /etc/nginx/sites-available/sites-8808 (симлинк в sites-enabled)
# Та же схема, что на старом VPS: root /var/www, каждый проект — своя
# подпапка под своим URL-префиксом, без домена, на порту 8808.
server {
    listen 8808;
    listen [::]:8808;
    server_name _;

    root /var/www;
    index index.html;
    charset utf-8;

    # Архивы и служебные файлы проектов — не отдавать
    location ~ /\.(?!well-known) { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }

    # PHP исполняется только для publish.php ИИ-редактора
    location = /ai-editor/publish.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        client_max_body_size 4m;
    }

    # ...и для ленты Предложки (её забирает админка сайта)
    location = /ai-editor/feed.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    }

    # Любой другой .php — не исполнять и не отдавать исходник
    location ~ \.php$ { return 404; }
}
